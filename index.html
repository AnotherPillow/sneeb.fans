<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sneeb fans</title>
    <meta content="sneeb.fans" property="og:title" />
    <meta property="og:image" content="https://cdn.nest.rip/uploads/aa93bcbc-147b-407f-bd26-dc333dd4f2a3.avif" />
    <meta property="og:image:width" content="878" />
    <meta property="og:image:height" content="659" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://cdn.nest.rip/uploads/aa93bcbc-147b-407f-bd26-dc333dd4f2a3.avif" />
    <style>
        #main {
            width: 100%;
            height: 100%;
            
            inset: 0;
            position: absolute;
            
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            
            background: #1a1a1a;
        }

        p {
            font-family: sans-serif;
            color: white;
            margin: 0;
        }

        #txt {
            height: 9em;
            width: fit-content;
        }

        #count {
            font-size: 7em;
        }

        #info {
            font-size: 1.5em;
            color: hsl(0, 0%, 47%);
        }

        #badge img {
            margin-top: 4px;
            height: 88px;
            image-rendering: pixelated;

            &:hover {
                filter: brightness(0.8);
            }
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="txt">
            <p id="count"></p>
            <p id="info">loyal followers of the sneeb</p>
            <p id="badge">
                <!-- cursed? yes. it works though! -->
                <a href="#" onclick="event.preventDefault(); l = this.cloneNode(true); l.children[0].src=l.children[0].src; l.href = location.href.replace('#', ''); l.removeAttribute('onclick'); navigator.clipboard.writeText(l.outerHTML.replaceAll(/(\s{4}|\n|\r)/g, ''))">
                    <img src="/88x31.png" alt="an image showing a black cat on the left and the text sneeb fans on the right of it.">
                </a>
            </p>
        </div>
    </div>
    <script type="module">
        window.count.innerText = (await fetch(`https://discord.com/api/v9/invites/3pKKPqvVrh?with_counts=true&with_expiration=true`).then(r => r.json())).profile.member_count + 1 // + 1 to reflect roomate's loyalty to the sneeb
    </script>
</body>
</html>
